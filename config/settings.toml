# Cấu hình chung. Sửa ở đây, không sửa trong code.

[data]
raw_prices_dir = "data/raw/prices"     # đặt file CSV giá thật ở đây, mỗi mã một file: FPT.csv
raw_excel_dir = "data/raw/excel"
raw_bctc_dir = "data/raw/bctc"         # BCTC năm đã chuẩn hoá, mỗi mã một file (để đối chiếu)       # file Excel tải từ web: data/raw/excel/FPT/*.xlsx
sample_prices_dir = "data/sample/prices"
warehouse = "data/warehouse.duckdb"
charts_dir = "data/charts"
signals_csv = "data/signals.csv"       # bản sao lịch sử khuyến nghị (không bị .gitignore, commit để giữ lại)

# Đơn vị giá trong file CSV: "auto" | "dong" | "nghin"
# auto: nếu trung vị giá đóng cửa < 1000 thì coi là nghìn đồng và nhân 1000.
price_unit = "auto"

[market]
# Biên độ dao động (kiểm tra lại khi quy định thay đổi)
band_hose = 0.07
band_hnx = 0.10
band_upcom = 0.15
default_exchange = "HOSE"   # dùng khi chưa biết sàn của mã (chưa tải được danh sách niêm yết)

[market.ticks]
# Bước giá theo sàn: giá ≥ ngưỡng -> bước giá (đồng)
HOSE = [[0, 10], [10_000, 50], [50_000, 100]]
HNX = [[0, 100]]
UPCOM = [[0, 100]]

[auto]
# Tự lấy dữ liệu khi phân tích một mã bất kỳ (lệnh analyze, ô nhập mã trên dashboard, MCP)
years = 5                   # số năm giá tải lần đầu
overlap_days = 10           # tải lại 10 ngày cuối để so khớp và bắt các phiên nguồn sửa lại
adjust_tolerance = 0.005    # giá cũ lệch > 0,5% so với lần tải mới -> có sự kiện quyền, tải lại toàn bộ
market_close_hour = 15      # trước 15h (giờ Việt Nam) chưa có giá phiên hôm nay
bctc_max_age_days = 30      # BCTC trong kho cũ hơn số ngày này thì tải lại
listing_max_age_days = 30   # danh sách niêm yết (sàn, ngành) cũ hơn số ngày này thì tải lại
pause = 0.3                 # giây nghỉ giữa các lần gọi CafeF

[watchlist]
symbols = ["FPT", "HPG", "MWG", "VNM", "DGC"]

[valuation]
# Giả định định giá — xem lại định kỳ. Tỷ lệ dạng thập phân (0.035 = 3,5%).
index = "VNINDEX"              # chỉ số để tính beta (lệnh fetch tự tải kèm)
risk_free = 0.035              # lợi suất trái phiếu Chính phủ 10 năm
equity_risk_premium = 0.08     # phần bù rủi ro thị trường cổ phiếu Việt Nam
terminal_growth = 0.03         # tăng trưởng dài hạn của FCFF (không nên vượt tăng trưởng GDP danh nghĩa)
forecast_years = 5
max_stage1_growth = 0.15       # g1 lấy từ CAGR LNST công ty mẹ, chặn trên ở mức này
fade_growth = true             # g1 giảm dần về terminal_growth trong 5 năm dự phóng
default_tax_rate = 0.20
default_beta = 1.0
beta_years = 3
adjust_beta = true             # beta Blume = 0,67 × beta thô + 0,33
par_value = 10000              # mệnh giá cổ phiếu (đồng)

[valuation.weights]
# Trọng số các phương pháp tính giá trị hợp lý (fa/fair_value.py); thiếu phương pháp nào thì chia lại
general = { dcf = 0.4, pe_hist = 0.3, pb_hist = 0.3 }
financial = { ri = 0.25, pb_roe = 0.25, pb_hist = 0.5 }

[valuation.financials]
# Ngân hàng / chứng khoán / bảo hiểm: thu nhập thặng dư + P/B hợp lý theo ROE (fa/fair_value.py)
forecast_years = 5
roe_years = 3               # ROE xuất phát = bình quân 3 năm gần nhất
roe_persistence = 0.5       # ROE dài hạn = k_e + 50% × (ROE hiện tại − k_e)
retention = 0.8             # tỷ lệ lợi nhuận giữ lại làm tăng vốn chủ (NH Việt Nam chia cổ tức tiền ít)

[fa_score]
# Điểm FA 0–100. Mỗi chỉ tiêu quy về 0–100 tuyến tính giữa [mức xấu, mức tốt].
issue_materiality = 0.01    # F-Score: tiền thu phát hành cp ≤ 1% vốn chủ coi như không phát hành
[fa_score.weights]
sinh_loi = 25        # ROE
tang_truong = 20     # tăng trưởng kép LNST cty mẹ
suc_khoe = 20        # Altman Z'', vay/VCSH
chat_luong = 15      # Piotroski F-Score, CFO/LNST trung bình 3 năm
dinh_gia = 20        # P/E, P/B, chênh lệch DCF

[fa_score.thresholds]
roe = [0.05, 0.25]
ni_cagr = [0.0, 0.20]
z_em = [1.1, 2.6]
debt_to_equity = [1.5, 0.3]   # số nhỏ là tốt
f_score = [2, 8]
cfo_to_ni = [0.5, 1.0]        # CFO / LNST cộng dồn 3 năm
pe = [25, 8]
pb = [4.0, 1.0]
dcf_upside = [-0.2, 0.3]

[fa_score.financials]
# Điểm FA cho định chế tài chính (scores.financial_score)
[fa_score.financials.weights]
sinh_loi = 35        # ROE
tang_truong = 20     # tăng trưởng kép LNST cty mẹ
an_toan = 15         # vốn chủ / tổng tài sản
dinh_gia = 30        # P/B, chênh lệch so với giá trị hợp lý
[fa_score.financials.thresholds]
roe = [0.08, 0.20]
ni_cagr = [0.0, 0.20]
pb = [3.0, 0.8]
fair_upside = [-0.2, 0.3]
[fa_score.financials.equity_to_assets]   # [mức xấu, mức tốt] theo loại doanh nghiệp
bank = [0.05, 0.11]
securities = [0.25, 0.60]
insurance = [0.10, 0.30]

[ta]
# Độ dài các chỉ báo kỹ thuật (phiên)
sma = [20, 50, 200]
rsi = 14
macd = [12, 26, 9]
bollinger = [20, 2.0]
atr = 14
adx = 14
volume_ma = [20, 50]
# Hỗ trợ/kháng cự: đỉnh/đáy cục bộ trong ±swing_window phiên, xét lookback phiên gần nhất,
# gom các mức chênh nhau không quá level_tolerance
swing_window = 5
lookback = 250
level_tolerance = 0.02

[ta_score.weights]
xu_huong = 40
dong_luong = 30
suc_manh = 15
dong_tien = 15

[plan]
capital = 100_000_000       # vốn dùng để tính khối lượng (đồng)
risk_per_trade = 0.01       # rủi ro tối đa mỗi lệnh: 1% vốn
atr_stop = 2.0              # cắt lỗ = giá vào − 2 × ATR14
min_stop_atr = 1.0          # cắt lỗ theo hỗ trợ phải cách giá vào ít nhất 1 ATR
max_stop_atr = 3.0          # chỉ dời cắt lỗ xuống dưới hỗ trợ nếu hỗ trợ cách giá vào ≤ 3 ATR
support_buffer_atr = 0.5    # đặt cắt lỗ dưới hỗ trợ 0,5 ATR
reward_multiples = [2.0, 3.0]
min_reward_risk = 2.0
lot_size = 100
# Bước giá theo sàn nằm ở [market.ticks]

[entry]
# Vùng giá mua khuyến nghị (ta/entry.py) — không lấy thẳng giá đóng cửa làm giá vào
max_pullback_atr = 2.0      # điểm neo (hỗ trợ / VWAP20 / SMA20) cách giá hiện tại tối đa 2 ATR
zone_atr = 0.5              # vùng mua rộng 0,5 ATR tính từ điểm neo
chase_atr = 2.0             # giá cách SMA20 > 2 ATR: cảnh báo không đuổi giá
vwap_sessions = 20
margin_of_safety = 0.15     # trần giá mua = giá trị hợp lý × (1 − 15%)
weak_fa_extra = 0.10        # điểm FA < 50: biên an toàn thêm 10%

[signals]
# Lịch sử khuyến nghị: mỗi lần recommend/analyze ghi vào bảng signals và file CSV (đưa lên Git được)
record = true
horizons = [5, 20, 60]      # số phiên để chấm lại khuyến nghị (lệnh review-signals)

[risk]
garch_window = 1000         # số phiên gần nhất dùng ước lượng GARCH
var_window = 750            # số phiên cho VaR lịch sử
confidence = [0.95, 0.99]
horizons = [20, 60]         # số phiên mô phỏng (≈ 1 tháng, 3 tháng)
n_paths = 10000
bootstrap = true            # rút phần dư thật (true) hay phân phối chuẩn (false)
seed = 42

[recommend]
weight_fa = 0.5             # điểm tổng = 50% FA + 30% TA + 20% Quant
weight_ta = 0.3
weight_quant = 0.2
buy_above = 65              # MUA khi điểm tổng ≥ 65 ...
min_ta_buy = 45             # ... và điểm TA ≥ 45 (xu hướng không xấu)
min_upside_buy = -0.10      # ... và giá không cao hơn giá trị DCF quá 10%
sell_below = 40             # TRÁNH khi điểm tổng < 40 (hoặc Altman Z'' vùng nguy cơ)
min_reward_risk = 2.0
high_vol = 0.40             # biến động năm trên 40% thì nhắc giảm khối lượng

[recommend.quant]
# Điểm Quant 0–100 (recommend/engine.py): [mức xấu, mức tốt], quy tuyến tính như điểm FA
prob_up = [0.40, 0.60]      # xác suất giá cao hơn hiện tại sau 60 phiên (Monte Carlo)
vol_annual = [0.60, 0.20]   # biến động năm (GARCH) — thấp là tốt
reward_risk = [1.0, 3.0]    # lãi/lỗ của mục tiêu 1 trong kế hoạch

[report]
# Độ tin cậy của khuyến nghị (report/card.py): đếm số điều kiện đạt
high_confidence = 5         # ≥ 5/6 điều kiện: Cao; ≥ 3: Trung bình; còn lại: Thấp
medium_confidence = 3
max_abs_upside = 0.6        # giá trị hợp lý lệch quá ±60% so với giá -> nghi mô hình không hợp với mã
max_value_spread = 1.6      # dải P90 / P10 giá trị nội tại hẹp hơn mức này thì tính là "định giá đồng thuận"
min_sessions = 500          # có ít nhất ~2 năm giá

[backtest]
entry_score = 65            # mua khi điểm TA ≥ 65
exit_score = 45             # bán khi điểm TA < 45
atr_stop = 2.0              # cắt lỗ cố định = giá mua − 2 × ATR14
fee = 0.0015                # phí môi giới mỗi chiều 0,15%
sell_tax = 0.001            # thuế bán 0,1%
