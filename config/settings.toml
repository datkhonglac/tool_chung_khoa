# Cấu hình chung. Sửa ở đây, không sửa trong code.

[data]
raw_prices_dir = "data/raw/prices"     # đặt file CSV giá thật ở đây, mỗi mã một file: FPT.csv
raw_excel_dir = "data/raw/excel"
raw_bctc_dir = "data/raw/bctc"         # BCTC năm đã chuẩn hoá, mỗi mã một file (để đối chiếu)       # file Excel tải từ web: data/raw/excel/FPT/*.xlsx
sample_prices_dir = "data/sample/prices"
warehouse = "data/warehouse.duckdb"
charts_dir = "data/charts"
signals_csv = "data/signals.csv"       # bản sao lịch sử khuyến nghị (không bị .gitignore, commit để giữ lại)
bank_manual = "config/bank_manual.toml"   # NPL, CASA, CAR ngân hàng nhập tay (nguồn miễn phí không có)
macro_map = "config/macro_map.toml"       # danh mục chuỗi vĩ mô + ánh xạ ngành → yếu tố vĩ mô
macro_manual = "config/macro_manual.toml" # số vĩ mô Việt Nam nhập tay (CPI, tín dụng, PMI...)
screen_dir = "data/screen"                # kết quả sàng lọc toàn thị trường (lệnh screen), mỗi lượt một CSV
trades = "data/portfolio/trades.csv"      # SỔ LỆNH thật (lệnh portfolio). KHÔNG đưa lên Git: repo đang công khai

# Đơn vị giá trong file CSV: "auto" | "dong" | "nghin"
# auto: nếu trung vị giá đóng cửa < 1000 thì coi là nghìn đồng và nhân 1000.
price_unit = "auto"

[market]
# Biên độ dao động (kiểm tra lại khi quy định thay đổi)
band_hose = 0.07
band_hnx = 0.10
band_upcom = 0.15
default_exchange = "HOSE"   # dùng khi chưa biết sàn của mã (chưa tải được danh sách niêm yết)

[market.ticks]
# Bước giá theo sàn: giá ≥ ngưỡng -> bước giá (đồng)
HOSE = [[0, 10], [10_000, 50], [50_000, 100]]
HNX = [[0, 100]]
UPCOM = [[0, 100]]

[auto]
# Tự lấy dữ liệu khi phân tích một mã bất kỳ (lệnh analyze, ô nhập mã trên dashboard, MCP)
years = 5                   # số năm giá tải lần đầu
overlap_days = 10           # tải lại 10 ngày cuối để so khớp và bắt các phiên nguồn sửa lại
adjust_tolerance = 0.005    # giá cũ lệch > 0,5% so với lần tải mới -> có sự kiện quyền, tải lại toàn bộ
market_close_hour = 15      # trước 15h (giờ Việt Nam) chưa có giá phiên hôm nay
# BCTC tải lại theo MÙA BÁO CÁO (data/autofetch.py bctc_due): đã có kỳ mới nhất đáng lẽ đã công bố
# thì không gọi vnstock nữa; doanh nghiệp nộp muộn thì thử lại mỗi bctc_retry_days ngày
bctc_season = true
quarter_lag_days = 30       # BCTC quý: kỳ kết thúc trước hôm nay ≥ 30 ngày coi như đã phải công bố
annual_lag_days = 100       # BCTC năm (kiểm toán, hạn 90 ngày)
bctc_retry_days = 3
bctc_max_age_days_current = 90   # đã có kỳ mới nhất: vẫn tải lại sau 90 ngày (bắt số điều chỉnh)
bctc_max_age_days = 30      # chỉ dùng khi bctc_season = false: BCTC cũ hơn số ngày này thì tải lại
listing_max_age_days = 30   # danh sách niêm yết (sàn, ngành) cũ hơn số ngày này thì tải lại
profile_max_age_days = 7    # hồ sơ (số cp lưu hành, sở hữu NN) và cổ tức cũ hơn số ngày này thì tải lại
pause = 0.3                 # giây nghỉ giữa các lần gọi CafeF
flow_sessions = 60          # số phiên giao dịch khối ngoại / tự doanh tải từ CafeF
macro = true                # cập nhật số vĩ mô (một lần mỗi lượt, khi đã cũ hơn [macro] max_age_hours)
news = true                 # tải tiêu đề tin theo mã (vnstock/VCI) — chỉ tham khảo, không vào điểm
news_max_age_hours = 12
status = true               # trạng thái giao dịch (bảng giá VCI): hạn chế/tạm ngừng -> chặn mua (v3)
status_max_age_hours = 12

[flows]
# Dòng tiền khối ngoại / tự doanh: chỉ để THAM KHẢO trên thẻ báo cáo, không vào điểm số
windows = [5, 20]           # cộng dồn mua/bán ròng 5 và 20 phiên

[macro]
# Lớp vĩ mô (src/vnsa/macro/). Lệnh: fetch-macro (tải), macro (xem). Chỉ THAM KHẢO và rào chắn,
# chưa vào điểm cho tới khi review-signals chứng minh có lợi thế.
years = 10                  # số năm tải lần đầu
z_years = 5                 # so biến động hiện tại với 5 năm gần nhất của chính chuỗi đó
z_cap = 2.0                 # chặn z trong ±2 (một chuỗi bất thường không lấn át cả ngành)
max_age_hours = 20          # phân tích tự tải lại số vĩ mô cũ hơn số giờ này
favorable = 0.3             # điểm ngành/bối cảnh ≥ 0,3 -> Thuận lợi; ≤ unfavorable -> Bất lợi
unfavorable = -0.3
min_coverage = 0.5          # yếu tố có số < 50% trọng số -> "Chưa đủ số liệu", không xếp loại
guard = -0.5                # rào chắn: ngành ≤ −0,5 (độ phủ ≥ guard_coverage) -> độ tin cậy giảm 1 bậc
guard_coverage = 0.6
rf_series = "vn_gov_10y"    # WACC/k_e dùng lợi suất TPCP 10 năm nhập tay nếu kỳ đó không cũ quá
rf_max_age_days = 45        # số ngày này (tính từ cuối tháng); ngược lại dùng [valuation] risk_free
sensitivity_min_months = 36 # độ nhạy (hồi quy tháng giá mã theo yếu tố) cần ≥ 36 tháng số liệu chung
news_items = 5              # số tiêu đề tin (vnstock/VCI) trong 30 ngày gần nhất hiện trên thẻ/MCP
news_days = 30

[watchlist]
symbols = ["FPT", "HPG", "MWG", "VNM", "DGC"]

[valuation]
# Giả định định giá — xem lại định kỳ. Tỷ lệ dạng thập phân (0.035 = 3,5%).
index = "VNINDEX"              # chỉ số để tính beta (lệnh fetch tự tải kèm)
risk_free = 0.035              # lợi suất trái phiếu Chính phủ 10 năm
equity_risk_premium = 0.08     # phần bù rủi ro thị trường cổ phiếu Việt Nam
terminal_growth = 0.03         # tăng trưởng dài hạn của FCFF (không nên vượt tăng trưởng GDP danh nghĩa)
forecast_years = 5
max_stage1_growth = 0.15       # g1 lấy từ CAGR LNST công ty mẹ, chặn trên ở mức này
# Chất lượng lợi nhuận (tránh "rẻ so với chính nó" khi lợi nhuận đã đi xuống):
roe_adjust = true              # P/B lịch sử × (ROE hiện tại / ROE trung vị lịch sử), tối đa 1
no_rerate_below = -0.05        # LNST giảm nhanh hơn 5%/năm: P/E mục tiêu ≤ P/E hiện tại, DCF lấy
declining_base = true          #   FCFF gốc = min(bình quân 3 năm, năm gần nhất)
consensus_cap = 0.3            # giá trị hợp lý tối đa = giá mục tiêu CTCK × 1,3 (0 = tắt)
fade_growth = true             # g1 giảm dần về terminal_growth trong 5 năm dự phóng
default_tax_rate = 0.20
default_beta = 1.0
beta_years = 3
adjust_beta = true             # beta Blume = 0,67 × beta thô + 0,33
par_value = 10000              # mệnh giá cổ phiếu (đồng)
multiple_reversion = 0.5       # P/E, P/B mục tiêu 12 tháng thu hẹp 50% khoảng cách hiện tại → trung vị lịch sử (1 = quay hẳn về)
min_peers = 3                  # số mã cùng ngành (đã có trong kho) tối thiểu để dùng P/E, P/B ngành
max_peer_pe = 60               # bỏ mã cùng ngành có P/E ≤ 0 hoặc > 60 (lợi nhuận bất thường)

[valuation.weights]
# Trọng số các phương pháp tính giá trị hợp lý (fa/fair_value.py); thiếu phương pháp nào thì chia lại
# pe_peer, pb_peer: bội số trung vị NGÀNH (chỉ khi kho có ≥ min_peers mã cùng ngành; không có thì
# chia lại cho các phương pháp còn lại như trước)
general = { dcf = 0.4, pe_hist = 0.3, pb_hist = 0.3, pe_peer = 0.15, pb_peer = 0.15 }
# Nhóm ngành đặc thù (nâng cấp v2.0, bước 2.1; nhóm theo [valuation.groups]):
# chu kỳ: lợi nhuận đỉnh/đáy làm P/E và DCF lệch -> neo nhiều hơn vào giá trị sổ sách
cyclical = { dcf = 0.15, pe_hist = 0.2, pb_hist = 0.35, pe_peer = 0.15, pb_peer = 0.15 }
# bất động sản: doanh thu theo điểm bàn giao dự án, FCFF thất thường -> bỏ DCF
real_estate = { dcf = 0.0, pe_hist = 0.15, pb_hist = 0.45, pe_peer = 0.1, pb_peer = 0.3 }
financial = { ri = 0.25, pb_roe = 0.25, pb_hist = 0.5, pb_peer = 0.25 }

[valuation.groups]
# Tên nhóm ngành (config/macro_map.toml [[industry]] name) dùng trọng số định giá riêng ở trên.
# Thêm/bớt nhóm tại đây (vd thêm "Nông nghiệp, thuỷ sản" vào cyclical nếu bạn coi là chu kỳ).
real_estate = ["Bất động sản"]
cyclical = ["Thép", "Hoá chất, phân bón", "Dầu khí"]

[valuation.financials]
# Ngân hàng / chứng khoán / bảo hiểm: thu nhập thặng dư + P/B hợp lý theo ROE (fa/fair_value.py)
forecast_years = 5
roe_years = 3               # ROE xuất phát = bình quân 3 năm gần nhất
roe_persistence = 0.5       # ROE dài hạn = k_e + 50% × (ROE hiện tại − k_e)
retention = 0.8             # tỷ lệ lợi nhuận giữ lại làm tăng vốn chủ (NH Việt Nam chia cổ tức tiền ít)

[fa_score]
# Điểm FA 0–100. Mỗi chỉ tiêu quy về 0–100 tuyến tính giữa [mức xấu, mức tốt].
issue_materiality = 0.01    # F-Score: tiền thu phát hành cp ≤ 1% vốn chủ coi như không phát hành
[fa_score.weights]
sinh_loi = 25        # ROE
tang_truong = 20     # tăng trưởng kép LNST cty mẹ
suc_khoe = 20        # Altman Z'', vay/VCSH
chat_luong = 15      # Piotroski F-Score, CFO/LNST trung bình 3 năm
dinh_gia = 20        # P/E, P/B, chênh lệch DCF

[fa_score.thresholds]
roe = [0.05, 0.25]
ni_cagr = [0.0, 0.20]
z_em = [1.1, 2.6]
debt_to_equity = [1.5, 0.3]   # số nhỏ là tốt
f_score = [2, 8]
cfo_to_ni = [0.5, 1.0]        # CFO / LNST cộng dồn 3 năm
pe_rel = [1.3, 0.7]           # P/E hiện tại / trung vị lịch sử của mã: cao hơn 30% = 0 điểm, thấp hơn 30% = 100
pb_rel = [1.3, 0.7]
dcf_upside = [-0.2, 0.3]

[fa_score.financials]
# Điểm FA cho định chế tài chính (scores.financial_score)
[fa_score.financials.weights]
sinh_loi = 30        # ROE
tang_truong = 15     # tăng trưởng kép LNST cty mẹ
an_toan = 10         # vốn chủ / tổng tài sản
hieu_qua = 10        # ngân hàng: NIM, CIR (fa/sector.py), CASA (nhập tay)
rui_ro = 10          # ngân hàng: chi phí tín dụng · chứng khoán: cho vay ký quỹ / vốn chủ
chat_luong_tai_san = 10   # ngân hàng: nợ xấu, bao phủ nợ xấu (nhập tay config/bank_manual.toml)
dinh_gia = 25        # P/B, chênh lệch so với giá trị hợp lý
[fa_score.financials.thresholds]
roe = [0.08, 0.20]
ni_cagr = [0.0, 0.20]
pb_rel = [1.3, 0.7]
fair_upside = [-0.2, 0.3]
nim = [0.025, 0.045]
cir = [0.50, 0.30]             # số nhỏ là tốt
credit_cost = [0.025, 0.005]   # dự phòng / dư nợ bình quân; số nhỏ là tốt
margin_to_equity = [1.8, 0.8]  # luật cho phép tối đa 2 lần vốn chủ
npl = [0.03, 0.01]             # nợ xấu / dư nợ (nhập tay); số nhỏ là tốt
npl_coverage = [0.5, 1.5]      # dự phòng / nợ xấu (lần)
casa = [0.10, 0.40]
car = [0.09, 0.13]             # tối thiểu theo NHNN 8%
min_bank_peers = 4             # số ngân hàng KHÁC trong kho tối thiểu để chấm NIM/CIR/chi phí tín dụng theo ngành
[fa_score.financials.relative]
# Khi kho có ≥ min_bank_peers ngân hàng: chấm theo tỷ lệ so với trung vị ngành [mức xấu, mức tốt]
nim = [0.8, 1.2]               # NIM bằng 80% trung vị = 0 điểm, 120% = 100 điểm
cir = [1.2, 0.8]
credit_cost = [1.5, 0.5]
[fa_score.financials.equity_to_assets]   # [mức xấu, mức tốt] theo loại doanh nghiệp
bank = [0.05, 0.11]
securities = [0.25, 0.60]
insurance = [0.10, 0.30]

[ta]
# Độ dài các chỉ báo kỹ thuật (phiên)
sma = [20, 50, 200]
rsi = 14
macd = [12, 26, 9]
bollinger = [20, 2.0]
atr = 14
adx = 14
volume_ma = [20, 50]
# Hỗ trợ/kháng cự: đỉnh/đáy cục bộ trong ±swing_window phiên, xét lookback phiên gần nhất,
# gom các mức chênh nhau không quá level_tolerance
swing_window = 5
lookback = 250
level_tolerance = 0.02

[ta_score.weights]
xu_huong = 40
dong_luong = 30
suc_manh = 15
dong_tien = 15

[plan]
capital = 100_000_000       # vốn dùng để tính khối lượng (đồng)
risk_per_trade = 0.01       # rủi ro tối đa mỗi lệnh: 1% vốn
atr_stop = 2.0              # cắt lỗ = giá vào − 2 × ATR14
min_stop_atr = 1.0          # cắt lỗ theo hỗ trợ phải cách giá vào ít nhất 1 ATR
max_stop_atr = 3.0          # chỉ dời cắt lỗ xuống dưới hỗ trợ nếu hỗ trợ cách giá vào ≤ 3 ATR
support_buffer_atr = 0.5    # đặt cắt lỗ dưới hỗ trợ 0,5 ATR
reward_multiples = [2.0, 3.0]
min_reward_risk = 2.0
lot_size = 100
max_position_pct = 0.15     # trần tỷ trọng mỗi mã: 15% vốn
max_adv_pct = 0.10          # vị thế không quá 10% giá trị giao dịch bình quân 20 phiên (thanh khoản)
# Bước giá theo sàn nằm ở [market.ticks]

[portfolio]
# Danh mục đang nắm giữ (lệnh portfolio, sổ lệnh ở [data] trades) và giới hạn khi lập kế hoạch mua
max_sector_pct = 0.30       # tổng giá trị một nhóm ngành tối đa 30% vốn (kể cả lệnh mới)
corr_sessions = 120         # tương quan lợi suất ngày với các mã đang giữ, 120 phiên gần nhất
corr_threshold = 0.60       # tương quan cực đại > 0,6: giảm ngân sách rủi ro của lệnh mới
corr_max_cut = 0.50         # ... giảm tuyến tính, tối đa 50% khi tương quan = 1
max_heat = 0.05             # tổng số tiền lỗ nếu MỌI mã cùng về cắt lỗ (kể cả lệnh mới) ≤ 5% vốn
default_risk_pct = 0.10     # mã chưa đặt cắt lỗ: coi rủi ro = 10% giá trị vị thế
dividend_tax = 0.05         # thuế TNCN trên cổ tức tiền (khấu trừ tại nguồn)
bonus_sellable_sessions = 15   # cổ phiếu thưởng/cổ tức cp bán được sau ~15 phiên (chờ niêm yết bổ sung)

[entry]
# Vùng giá mua khuyến nghị (ta/entry.py) — không lấy thẳng giá đóng cửa làm giá vào
max_pullback_atr = 2.0      # điểm neo (hỗ trợ / VWAP20 / SMA20) cách giá hiện tại tối đa 2 ATR
zone_atr = 0.5              # vùng mua rộng 0,5 ATR tính từ điểm neo
chase_atr = 2.0             # giá cách SMA20 > 2 ATR: cảnh báo không đuổi giá
vwap_sessions = 20
margin_of_safety = 0.15     # trần giá mua = giá trị hợp lý × (1 − 15%)
weak_fa_extra = 0.10        # điểm FA < 50: biên an toàn thêm 10%
# Thang mua 3 lớp (v2.1, ta/entry.py): 3 lệnh LO ở 3 độ sâu thay cho vùng hẹp sát giá.
# Kiểm định 10 năm × 45 mã (study-entry, docs/kiem_dinh_thoi_diem.md): giá vốn rẻ hơn ~4% nhưng chỉ khớp
# ~43% vốn nên lãi trên TỔNG vốn thấp hơn vùng cũ ở cả hai giai đoạn -> mặc định TẮT, chỉ hiển thị
# lớp 2, 3 làm mức mua thêm tham khảo. Đặt ladder = true nếu bạn ưu tiên giá vốn thấp hơn số lần mua được.
ladder = false
# Điểm neo vùng mua (v4): "classic" = hỗ trợ/VWAP20/SMA20; "va" = cận trên vùng giá trị/POC của hồ
# sơ khối lượng; "mixed" = cả hai. Chỉ đổi sau khi study-entry cho thấy "Vùng VA" tốt hơn vùng cũ.
anchor_mode = "classic"
vp_sessions = 120            # hồ sơ khối lượng 120 phiên
vp_bins = 50
ladder_show = true
ladder_weights = [0.3, 0.4, 0.3]   # lớp 1 thăm dò · lớp 2 chính · lớp 3 sâu
l2_range_atr = 4.0          # lớp 2 tìm mức đỡ mạnh trong 4 ATR dưới giá
l3_range_atr = 7.0          # lớp 3 tìm trong 7 ATR dưới giá
ladder_gap_atr = 0.75       # hai lớp liền nhau cách ít nhất 0,75 ATR
ladder_fallback_atr = 1.5   # không có mức đỡ: lớp sau = lớp trước − 1,5 ATR
ladder_stop_atr = 1.0       # cắt lỗ thấp hơn lớp 3 ít nhất 1 ATR

[signals]
# Lịch sử khuyến nghị: mỗi lần recommend/analyze ghi vào bảng signals và file CSV (đưa lên Git được)
record = true
horizons = [5, 20, 60]      # số phiên để chấm lại khuyến nghị (lệnh review-signals)
# Mã workflow hằng ngày (.github/workflows/daily.yml) phân tích và lưu khuyến nghị vào nhánh `signals`
daily = ["FPT", "HPG", "MWG", "VNM", "DGC", "VCB", "TCB", "MBB", "SSI", "ACV", "TNG", "GMD"]

[journal]
# Nhật ký giao dịch (portfolio report, journal.py): điểm kỷ luật 0–100
plan_days = 7                # lệnh mua "theo kế hoạch" = có khuyến nghị lưu trong 7 ngày trước ...
zone_tolerance = 0.01        # ... và giá mua ≤ đỉnh vùng mua × (1 + 1%)
stop_sessions = 2            # đặt cắt lỗ / bán khi thủng cắt lỗ trong 2 phiên
