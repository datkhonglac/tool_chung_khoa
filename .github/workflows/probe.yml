name: Thử nguồn BCTC (tạm)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai 2>&1 | tail -3
      - run: pip show vnstock | head -3
      - name: Probe
        run: |
          python - <<'PY'
          import pandas as pd, traceback, vnstock
          pd.set_option("display.width", 250); pd.set_option("display.max_columns", 50); pd.set_option("display.max_rows", 200)
          print("vnstock", getattr(vnstock, "__version__", "?"))
          print([n for n in dir(vnstock) if not n.startswith("_")])
          for src in ["KBS", "VCI"]:
              for kind in ["income_statement", "balance_sheet", "cash_flow"]:
                  try:
                      from vnstock import Finance
                      f = Finance(source=src, symbol="FPT")
                      df = getattr(f, kind)(period="year")
                      print(f"\n===== {src} {kind}: shape {df.shape}")
                      print(list(df.columns)[:40])
                      print(df.head(60).to_string()[:12000])
                  except Exception:
                      print(f"\n===== {src} {kind}: ERROR"); traceback.print_exc()
          PY
