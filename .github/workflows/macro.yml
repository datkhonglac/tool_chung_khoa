name: Vĩ mô

# Dò nguồn và tải số liệu vĩ mô (FRED, World Bank, tỷ giá, nhập tay) trên máy chủ GitHub.
# Kết quả in trong log; kho DuckDB ở mục Artifacts.
on:
  push:                         # chạy khi phần vĩ mô thay đổi
    paths:
      - ".github/workflows/macro.yml"
      - "scripts/probe_macro.py"
      - "src/vnsa/macro/**"
      - "src/vnsa/data/providers/macro_provider.py"
      - "config/macro_map.toml"
  workflow_dispatch:
    inputs:
      probe:
        description: "Dò lại các nguồn (scripts/probe_macro.py)"
        type: boolean
        default: true

jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      VNSTOCK_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai
      - name: Dò nguồn vĩ mô
        if: github.event_name == 'push' || inputs.probe
        continue-on-error: true
        run: python scripts/probe_macro.py
