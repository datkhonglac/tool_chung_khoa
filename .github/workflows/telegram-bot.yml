name: Bot Telegram

# Trả lời tin nhắn gửi cho bot Telegram: nhắn mã cổ phiếu -> thẻ báo cáo.
# Cách chính (v3.2): Cloudflare Worker (deploy/telegram-worker.js) nhận tin và gọi repository_dispatch
# -> chạy NGAY `bot --update` (~2–4 phút). Lịch 10 phút chỉ là dự phòng khi chưa có webhook — thực tế
# GitHub chỉ cho chạy mỗi 3–5 giờ. Cần secrets TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID;
# thêm VNSA_BACKUP_REPO / VNSA_BACKUP_TOKEN để /danhmuc, /nhatky đọc được sổ lệnh.
# Repo công khai: nhật ký chỉ in số tin đã trả lời, không in nội dung.
on:
  repository_dispatch:
    types: [telegram]
  schedule:
    - cron: "*/10 0-16 * * *"
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      VNSTOCK_TELEMETRY: "off"
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VNSA_BACKUP_REPO: ${{ secrets.VNSA_BACKUP_REPO }}
      VNSA_BACKUP_TOKEN: ${{ secrets.VNSA_BACKUP_TOKEN }}
    steps:
      - name: Có tin nhắn mới không?
        id: check
        if: github.event_name != 'repository_dispatch'
        run: |
          n=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" \
                -H "Content-Type: application/json" -d '{"timeout":0}' \
              | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('result',[])))" || echo 0)
          echo "Tin đang chờ: $n"
          echo "pending=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.pending != '0'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.pending != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.check.outputs.pending != '0'
        run: |
          pip install -q -e .
          pip install -q -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai
      - name: Lấy kho dữ liệu lần trước
        if: steps.check.outputs.pending != '0'
        uses: actions/cache/restore@v4
        with:
          path: data/warehouse.duckdb
          key: bot-${{ github.run_id }}
          restore-keys: bot-
      - name: Lấy khuyến nghị và sổ lệnh
        if: steps.check.outputs.pending != '0'
        run: |
          git fetch --depth=1 origin signals:refs/remotes/origin/signals || true
          if [ -n "$VNSA_BACKUP_REPO" ]; then
            python -m vnsa.cli portfolio restore > /dev/null 2>&1 && echo "đã lấy sổ lệnh" || echo "không lấy được sổ lệnh"
          fi
      - name: Trả lời tin nhắn (từ Cloudflare Worker)
        if: github.event_name == 'repository_dispatch'
        env:
          UPDATE: ${{ toJson(github.event.client_payload.update) }}
        run: |
          printf '%s' "$UPDATE" > update.json
          python -m vnsa.cli bot --update update.json
      - name: Trả lời tin nhắn đang chờ (dự phòng)
        if: github.event_name != 'repository_dispatch' && steps.check.outputs.pending != '0'
        run: python -m vnsa.cli bot --once
      - name: Lưu kho cho lần sau
        if: always() && steps.check.outputs.pending != '0' && hashFiles('data/warehouse.duckdb') != ''
        uses: actions/cache/save@v4
        with:
          path: data/warehouse.duckdb
          key: bot-${{ github.run_id }}
      - name: Xoá sổ lệnh khỏi máy chạy
        if: always()
        run: rm -rf data/portfolio
