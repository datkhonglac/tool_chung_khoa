name: ci-probe
on:
  push:
    branches: [vnstock-gen6-fix]
jobs:
  probe:
    runs-on: ubuntu-latest
    env: {PYTHONUNBUFFERED: "1", VNSTOCK_TELEMETRY: "off"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -e ".[dev]"
      - run: pytest -q -x 2>&1 | tail -15 | sed 's/^/::notice::log /'
      - run: python -m vnsa.cli history import --git origin/signals 2>&1 | tail -2 | sed 's/^/::notice::log /'
      - run: python -m vnsa.cli screen --stage liquidity --limit 40 2>&1 | tail -25 | sed 's/^/::notice::log /'
      - run: python -m vnsa.cli history export h && wc -l h/*.csv | sed 's/^/::notice::log /'
