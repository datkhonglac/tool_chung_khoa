name: tam-do-vnstock5
on:
  push:
    branches: [vnstock-v5]
    paths: [".github/workflows/ci-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      VNSTOCK_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pip install -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai
      - run: |
          set +e
          python - > out.txt 2>&1 <<'PY'
          import pandas as pd
          from vnstock import Market
          for kw in ({"source": "vci"}, {"source": "VCI"}, {}):
              try:
                  df = Market().quote(["FPT", "DGC", "HPG"], **kw)
                  print(kw, type(df).__name__, getattr(df, "shape", None))
                  print([c for c in df.columns][:12], "status:", ("listing", "trading_status") in df.columns)
              except BaseException as e:
                  print(kw, "LỖI", type(e).__name__, str(e)[:200])
          PY
          echo "--- xong" >> out.txt
          true
      - run: |
          python - <<'PY'
          t = open("out.txt", encoding="utf-8", errors="ignore").read()
          n = 3500
          for i in range(0, min(len(t), n * 40), n):
              m = t[i:i + n].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=log {i // n:02d}::{m}")
          PY
