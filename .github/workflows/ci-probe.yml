name: ci-probe
on:
  push:
    branches: [vnstock-gen6-fix]
jobs:
  probe:
    runs-on: ubuntu-latest
    env: {PYTHONUNBUFFERED: "1", VNSTOCK_TELEMETRY: "off"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -e .
      - run: git fetch -q origin signals:refs/remotes/origin/signals && python -m vnsa.cli history import --git origin/signals 2>&1 | tail -3 | sed 's/^/::notice::log /'
      - run: python -m vnsa.cli analyze FPT HPG 2>&1 | head -80 | sed 's/^/::notice::log /'
      - run: python -m vnsa.cli monitor --send --public; echo "::notice::log monitor exit $?"
