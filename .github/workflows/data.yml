name: Kiểm tra và tải dữ liệu

# Chạy test, tải 5 năm giá (CafeF) và BCTC năm (vnstock/VCI) trên máy chủ GitHub.
# Kết quả (CSV + kho DuckDB) nằm ở mục Artifacts của mỗi lần chạy.
on:
  push:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Các mã, cách nhau bằng dấu cách (bỏ trống = danh sách theo dõi)"
        required: false
        default: ""
      years:
        description: "Số năm"
        required: false
        default: "5"
      skip_prices:
        description: "Bỏ qua bước tải giá (chỉ tải BCTC)"
        type: boolean
        default: false
      analyze:
        description: "Mã bất kỳ để thử lệnh analyze (tự tải giá, BCTC, sàn/ngành)"
        required: false
        default: "SHS VCB ACV"
      probe:
        description: "Mã để dò cấu trúc dữ liệu vnstock (scripts/probe_vnstock.py); bỏ trống = không dò"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,dashboard]"
      - run: pytest -q

  fetch:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai
      - name: Thử kết nối CafeF
        if: ${{ !inputs.skip_prices }}
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" \
            -A "Mozilla/5.0" "https://cafef.vn/du-lieu/Ajax/PageNew/DataHistory/PriceHistory.ashx?Symbol=FPT&StartDate=&EndDate=&PageIndex=1&PageSize=2"
      - if: ${{ !inputs.skip_prices }}
        run: python -m vnsa.cli fetch ${{ inputs.symbols }} --years ${{ inputs.years }}
      - if: ${{ !inputs.skip_prices }}
        run: python -m vnsa.cli list
      - name: Kiểm tra chất lượng từng mã
        if: ${{ !inputs.skip_prices }}
        run: for s in ${{ inputs.symbols || 'FPT HPG MWG VNM DGC' }}; do python -m vnsa.cli check $s; echo; done
      - name: Dò cấu trúc dữ liệu vnstock
        if: ${{ inputs.probe != '' }}
        continue-on-error: true
        run: python scripts/probe_vnstock.py ${{ inputs.probe }}
      - name: Tải BCTC năm (vnstock/VCI)
        run: python -m vnsa.cli fetch-bctc ${{ inputs.symbols }}
      - name: Chỉ số tài chính từng mã
        run: for s in ${{ inputs.symbols || 'FPT HPG MWG VNM DGC' }}; do python -m vnsa.cli ratios $s; echo; done
      - name: Định giá từng mã
        if: ${{ !inputs.skip_prices }}
        run: for s in ${{ inputs.symbols || 'FPT HPG MWG VNM DGC' }}; do python -m vnsa.cli value $s; echo; done
      - name: Điểm FA (F-Score, Altman Z)
        run: for s in ${{ inputs.symbols || 'FPT HPG MWG VNM DGC' }}; do python -m vnsa.cli fa-score $s; echo; done
      - name: Kỹ thuật và kế hoạch giao dịch
        if: ${{ !inputs.skip_prices }}
        run: for s in ${{ inputs.symbols || 'FPT HPG MWG VNM DGC' }}; do python -m vnsa.cli ta $s; echo; python -m vnsa.cli plan $s; echo; done
      - name: Rủi ro (GARCH, Monte Carlo, VaR)
        if: ${{ !inputs.skip_prices }}
        run: for s in ${{ inputs.symbols || 'FPT HPG MWG VNM DGC' }}; do python -m vnsa.cli risk $s; echo; done
      - name: Khuyến nghị và backtest
        if: ${{ !inputs.skip_prices }}
        run: |
          python -m vnsa.cli recommend ${{ inputs.symbols }}
          echo
          for s in ${{ inputs.symbols || 'FPT HPG MWG VNM DGC' }}; do python -m vnsa.cli backtest $s --last 5; echo; done
      - name: Kiểm tra MCP server và dashboard trên dữ liệu thật
        if: ${{ !inputs.skip_prices }}
        run: |
          pip install -e ".[mcp,dashboard]"
          python scripts/smoke_test.py ${{ inputs.symbols }}
      - name: Phân tích mã bất kỳ (tự tải dữ liệu)
        if: ${{ inputs.analyze != '' }}
        run: python -m vnsa.cli analyze ${{ inputs.analyze }}
      - name: Backtest và chỉ số ngành cho các mã vừa phân tích
        if: ${{ inputs.analyze != '' }}
        run: |
          for s in ${{ inputs.analyze }}; do python -m vnsa.cli backtest $s --last 3; echo; done
          for s in ${{ inputs.analyze }}; do python -m vnsa.cli fa-score $s 2>/dev/null | tail -25; echo; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: du-lieu-gia
          path: |
            data/raw/prices/*.csv
            data/raw/bctc/*.csv
            data/warehouse.duckdb
          if-no-files-found: ignore
