name: Sàng lọc thị trường

# Sàng lọc toàn thị trường (lệnh screen, src/vnsa/screen/) trên máy chủ GitHub: nhóm ngành tiềm
# năng và mã tiềm năng trong từng nhóm. Kết quả in trong log; CSV ở mục Artifacts; lịch sử các lượt
# (history/screen*.csv) lưu vào nhánh `signals` để review-screen chấm lại sau 20/60 phiên.
# Kho được giữ giữa các lần chạy (cache) nên BCTC đã tải không phải tải lại (vnstock chế độ Khách
# chỉ ~140 mã/giờ). Tuỳ chọn: thêm khoá API vnstock miễn phí vào Settings → Secrets and variables →
# Actions, tên VNSTOCK_API_KEY (hạn mức 60 lượt/phút thay vì 20).
# Lịch chạy chỉ có hiệu lực ở nhánh mặc định của repo (sau khi gộp PR).
on:
  schedule:
    - cron: "17 1 * * 6"        # 8:17 sáng thứ Bảy giờ Việt Nam
  push:                         # chạy thử khi phần sàng lọc thay đổi (tải BCTC tối đa 45 phút)
    paths:
      - ".github/workflows/screen.yml"
      - "src/vnsa/screen/**"
  workflow_dispatch:
    inputs:
      stage:
        description: "Chạy đến tầng: pick (đủ 4 tầng) | industry (đến nhóm ngành) | liquidity (chỉ thanh khoản)"
        required: false
        default: "pick"
      exchanges:
        description: "Sàn cần lọc, cách nhau dấu cách (bỏ trống = HOSE HNX UPCOM)"
        required: false
        default: ""
      limit:
        description: "Chỉ lấy N mã đầu danh sách để chạy thử (bỏ trống = tất cả)"
        required: false
        default: ""
      study:
        description: "Chạy thêm kiểm định quá khứ 10 năm phần giá (study-screen, thêm ~30 phút)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      VNSTOCK_TELEMETRY: "off"
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai
      - name: Lấy kho của lần chạy trước
        uses: actions/cache/restore@v4
        with:
          path: data/warehouse.duckdb*
          key: kho-sang-loc-${{ github.run_id }}
          restore-keys: kho-sang-loc-
      - name: Nạp lịch sử từ nhánh signals (BCTC tích luỹ, các lượt sàng lọc cũ)
        continue-on-error: true
        run: python -m vnsa.cli history import --git origin/signals
      - name: Sàng lọc
        run: >-
          python -m vnsa.cli screen --stage ${{ inputs.stage || 'pick' }} --top 40
          ${{ github.event_name == 'push' && '--deep-minutes 45' || '' }}
          ${{ inputs.exchanges && format('--exchanges {0}', inputs.exchanges) || '' }}
          ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - name: Chấm lại các lượt sàng lọc cũ
        if: always()
        run: python -m vnsa.cli review-screen | tee review_screen.txt
      - name: Kiểm định quá khứ phần giá (10 năm)
        if: inputs.study || github.event_name == 'push'
        continue-on-error: true
        run: python -m vnsa.cli study-screen
      - name: Nhóm ngành ← ngành ICB (kiểm tra macro_map.toml)
        if: always()
        run: python -m vnsa.cli screen --groups
      - name: Ghi lịch sử vào nhánh signals
        if: github.ref_name == github.event.repository.default_branch
        run: |
          python -m vnsa.cli history export history
          cp review_screen.txt history/review_screen.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin signals > /dev/null; then
            git fetch -q origin signals
            git worktree add -q -B signals store origin/signals
          else
            git worktree add -q --orphan -b signals store
          fi
          mkdir -p store/history
          cp history/*.csv history/review_screen.txt store/history/
          cd store
          git add history
          if git diff --cached --quiet; then
            echo "Không có gì mới"
          else
            git commit -q -m "Sàng lọc thị trường ngày $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
            git push -q origin signals || (git pull -q --rebase origin signals && git push -q origin signals)
          fi
      - name: Lưu kho cho lần chạy sau
        if: always() && hashFiles('data/warehouse.duckdb') != ''
        uses: actions/cache/save@v4
        with:
          path: data/warehouse.duckdb*
          key: kho-sang-loc-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sang-loc
          path: |
            data/screen/
            data/study/
            review_screen.txt
          if-no-files-found: ignore
