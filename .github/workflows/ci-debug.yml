name: Gỡ lỗi tạm (nang-cap-v2)
on:
  push:
    branches: [nang-cap-v2]
    paths: [".github/workflows/ci-debug.yml", ".github/debug.sh"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -q
      - run: pip install -q -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai
      - name: Chạy
        run: |
          bash .github/debug.sh > out.txt 2>&1 || true
          for part in 0 1 2 3; do
            chunk=$(sed -n "$((part*40+1)),$((part*40+40))p" out.txt)
            [ -z "$chunk" ] && break
            msg=$(printf '%s' "$chunk" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::warning title=log-$part::$msg"
          done
